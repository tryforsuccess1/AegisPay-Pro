async function activateClientTier(tierId){
 let chosen=null;
 const available=Math.max(0,Number(profile.current_platform_balance||0)-Number(profile.withdrawal_held||0));
 try{
   chosen=tiers.find(x=>String(x.id)===String(tierId));
   if(!chosen)throw Error('Please select a valid tier.');
   if(available<Number(chosen.deposit_amount||0))throw Error('Your available balance is below this tier requirement.');
   const r=await db.rpc('ai_activate_tier',{p_tier_id:String(tierId)});
   if(r.error)throw r.error;
   await initData();
   await liveShop();
   uiNotice('Tier '+String(chosen.name)+' activated. Your Shop tasks are being assigned automatically.','success');
 }catch(e){
   const message=String(e&&e.message||'Unable to activate tier.');
   if(/balance is below|tier requirement|insufficient available/i.test(message)){
     const required=chosen?Number(chosen.deposit_amount||0):0;
     uiNotice('Not enough available USDT. '+(chosen?chosen.name+' requires '+required.toFixed(2)+' USDT. ':'')+'Your available balance is '+available.toFixed(2)+' USDT.','error');
   }else if(/current Shop cycle must finish|cycle.*finish before another tier/i.test(message)){
     uiNotice('Tier switching is locked until the current Shop cycle is finished and settled.','info');
   }else if(/Selected tier is unavailable/i.test(message)){
     uiNotice('This tier is currently unavailable. Refresh the tier list and try again.','error');
   }else{
     uiNotice(message,'error');
   }
 }
}

function taskImageUrl(url){

function bindTaskImageFallback(root){
 if(!root)return;
 const probe=(img,url,mode)=>{
  const target=String(url||'').trim();if(!target)return;
  const p=new Image();
  p.onload=()=>{img.src=target;img.dataset.imageState='remote';};
  p.onerror=()=>{
   if(mode==='remote'){
    const direct=img.dataset.directSrc||'';
    if(direct && img.dataset.directTried!=='1'){img.dataset.directTried='1';probe(img,direct,'direct');}
   }
  };
  p.src=target;
 };
 root.querySelectorAll('img[data-remote-src]').forEach(img=>{
  if(img.dataset.imageFallbackBound)return;
  img.dataset.imageFallbackBound='1';
  probe(img,img.dataset.remoteSrc,'remote');
 });
}function bindTaskDelegation(){

  document.addEventListener('click',function(e){
    const view=e.target.closest('[data-open-task-product]');
    if(view){e.preventDefault();e.stopPropagation();openTaskProduct(view.getAttribute('data-open-task-product')||'');return;}
    const done=e.target.closest('[data-complete-task]');
    if(done){e.preventDefault();e.stopPropagation();completeShopTask(done.getAttribute('data-complete-task')||'');return;}
    const close=e.target.closest('[data-close-task-product]');
    if(close){e.preventDefault();e.stopPropagation();closeTaskProduct();return;}
    const buy=e.target.closest('[data-buy-task-product]');
    if(buy){e.preventDefault();e.stopPropagation();openTaskMarketplace(buy.getAttribute('data-buy-task-product')||'');return;}
  },true);
}

async function completeShopCycle(cycleId){try{
 const t=await db.from('tasks').select('id,cycle_id,user_id,status,task_value,reward,title,description').eq('user_id',profile.id).eq('cycle_id',cycleId).order('id',{ascending:true});
 if(t.error)throw t.error;
 const tasks=t.data||[];
 if(!tasks.length)throw Error('No assigned Shop tasks were found for this cycle.');
 if(tasks.some(x=>String(x.status)==='Completed'))throw Error('This cycle is already partially completed. Please contact Master Admin for reconciliation.');
 const total=tasks.reduce((n,x)=>n+Number(x.task_value||0),0);
 const cycle=await db.from('cycle_runs').select('id,status,cycle_base').eq('id',cycleId).eq('user_id',profile.id).maybeSingle();
 if(cycle.error)throw cycle.error;
 if(!cycle.data)throw Error('Shop cycle not found.');
 if(String(cycle.data.status)!=='TASKS_OPEN')throw Error('This Shop cycle is no longer open for checkout.');
 if(Math.abs(total-Number(cycle.data.cycle_base||0))>0.01)throw Error('Assigned task values do not equal the full cycle balance.');
 const rr=await db.functions.invoke('complete-cycle-checkout',{body:{cycleId:cycleId,taskIds:tasks.map(x=>x.id)}});
 if(rr.error){let detail=null;try{if(rr.error.context&&typeof rr.error.context.clone==='function')detail=await rr.error.context.clone().json()}catch(_){}throw Error((detail&&detail.error)||rr.error.message||'Shop checkout failed.')}
 uiNotice(rr.data?.message||'Shop cycle completed. The 18-hour settlement timer has started.');
 await initData(); liveShop();
}catch(e){uiNotice(e.message||'Shop checkout failed')}}

const originalGo=window.go;
function bindAuthForms(){
  const login=document.getElementById('liveLogin');
  if(login && !login.dataset.bound){
    login.dataset.bound='1';
    login.addEventListener('submit',async e=>{
      e.preventDefault();e.stopPropagation();
      try{
        const identifier=document.getElementById('le').value.trim();
        const password=document.getElementById('lp').value;
        if(identifier.includes('@')){
          const r=await db.auth.signInWithPassword({email:identifier.toLowerCase(),password});
          if(r.error)throw r.error;
        }else{
          const response=await db.functions.invoke('username-login',{body:{username:identifier.toLowerCase(),password}});
          if(response.error){
            let detail=null;
            try{if(response.error.context&&typeof response.error.context.clone==='function')detail=await response.error.context.clone().json();}catch(_){}
            throw Error((detail&&detail.error)||response.error.message||'Invalid username or password.');
          }
          const tokens=response.data||{};
          if(!tokens.access_token||!tokens.refresh_token)throw Error('Invalid username or password.');
          const stored=await db.auth.setSession({access_token:tokens.access_token,refresh_token:tokens.refresh_token});
          if(stored.error)throw stored.error;
        }
        await initData();
        if(profile.role!=='USER'){
          await db.auth.signOut();
          profile=null;
          authUser=null;
          throw Error('This account does not have client access.');
        }
        if(!['ACTIVE','NORMAL'].includes(String(profile.status||'').toUpperCase())){
          await db.auth.signOut();
          profile=null;
          authUser=null;
          throw Error('This account is not active.');
        }
        recordClientAccess('LOGIN');
        await liveHome();
      }catch(x){
        const msg=x.message||'Login failed';
        uiNotice(/email not confirmed|email.*confirm|not verified/i.test(msg)?'Please verify your email first. Check your Gmail/Spam folder.':(/invalid login credentials/i.test(msg)?'Invalid username/email or password.':msg));
      }
    },true);
  }
  const forgot=document.getElementById('forgotForm');
  if(forgot && !forgot.dataset.bound){
    forgot.dataset.bound='1';
    forgot.addEventListener('submit',async e=>{
      e.preventDefault();e.stopPropagation();
      const button=forgot.querySelector('button[type="submit"],button');
      const email=document.getElementById('fe').value.trim().toLowerCase();
      if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent='Sending...'}
      try{
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Please enter a valid registered email address.');
        const r=await db.auth.resetPasswordForEmail(email,{
          redirectTo:'https://aegispay-web.aegispay.workers.dev/?reset=1'
        });
        if(r.error)throw r.error;
        uiNotice('If an account exists for this email, a password reset link has been sent. Please check your Gmail and Spam folder.','success');
        if(button){button.disabled=false;button.textContent=button.dataset.originalText||'Send Reset Link '+ic('arrow')}
      }catch(x){
        if(button){button.disabled=false;button.textContent=button.dataset.originalText||'Send Reset Link '+ic('arrow')}
        uiNotice(x.message||'Unable to send password reset email. Please try again.');
      }
    },true);
  }
  const signup=document.getElementById('liveSignup');
  if(signup && !signup.dataset.bound){
    signup.dataset.bound='1';
    signup.addEventListener('submit',async e=>{
      e.preventDefault();e.stopPropagation();
      const button=signup.querySelector('button[type="submit"],button');
      if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent='Creating Account...'}
      try{
        const email=document.getElementById('se').value.trim().toLowerCase();
        const username=document.getElementById('su').value.trim().toLowerCase();
        if(!/^[a-z0-9_]{3,32}$/.test(username))throw Error('Username must be 3–32 characters using letters, numbers, or underscore.');
        const rr=await db.functions.invoke('public-signup',{body:{
          email,password:document.getElementById('sp').value,
          name:formatName(document.getElementById('sn').value),
          username,referralCode:document.getElementById('sr').value.trim().toUpperCase(),
          preferredLanguage:'en',redirectTo:'https://aegispay-web.aegispay.workers.dev/?verified=1'
        }});
        if(rr.error){
          let serverMessage=rr.data && typeof rr.data==='object' && rr.data.error ? rr.data.error : '';
          const serverCode=rr.data && typeof rr.data==='object' && rr.data.code ? rr.data.code : '';
          if(!serverMessage && rr.error && rr.error.context && typeof rr.error.context.json==='function'){
            try{
              const body=await rr.error.context.clone().json();
              serverMessage=body && body.error ? body.error : '';
            }catch(_){}
          }
          const status=Number(rr.error && (rr.error.status || rr.error.context && rr.error.context.status) || 0);
          if(status===409 || serverCode==='PROFILE_EXISTS' || serverCode==='USERNAME_EXISTS'){
            throw Error(serverMessage || 'This email or username is already registered. Please use a different email or username.');
          }
          const msg=serverMessage || rr.error.message || 'Signup failed. Please try again.';
          if(serverCode==='EMAIL_DELIVERY_FAILED' || /email verification service|confirmation email|email delivery/i.test(msg)){
            throw Error('Email verification service is temporarily unavailable. Please try again after the email service is fixed.');
          }
          throw Error(msg);
        }
        app.innerHTML=SC.verifyPending(email);
        bindAuthForms();
        const rb=document.getElementById('resendVerify');
        if(rb)rb.onclick=async()=>{
          try{
            rb.disabled=true;rb.textContent='Sending...';
            const r=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://aegispay-web.aegispay.workers.dev/?verified=1'}});
            if(r.error)throw r.error;
            uiNotice('A new verification email has been sent.','success');
            rb.textContent='Resend Verification Email';rb.disabled=false;
          }catch(x){rb.disabled=false;rb.textContent='Resend Verification Email';uiNotice(x.message||'Unable to resend verification email.')}
        };
      }catch(x){
        uiNotice(x.message||'Signup failed');
        if(button){button.disabled=false;button.textContent=button.dataset.originalText||'Sign Up'}
      }
    },true);
  }
}

const AI_HISTORY_KEY='aegispay_ai_history_v2';
let aiHistory=[];

function aiLoadHistory(){
  try{
    const key=AI_HISTORY_KEY+':'+String(profile?.id||'guest');
    const raw=sessionStorage.getItem(key);
    const parsed=raw?JSON.parse(raw):[];
    aiHistory=Array.isArray(parsed)?parsed.filter(x=>x&&['user','assistant'].includes(x.role)&&typeof x.content==='string').slice(-20):[];
  }catch(_){aiHistory=[]}
  if(!Array.isArray(aiHistory))aiHistory=[];
}
function aiSaveHistory(){
  try{
    const key=AI_HISTORY_KEY+':'+String(profile?.id||'guest');
    sessionStorage.setItem(key,JSON.stringify(aiHistory.slice(-20)));
  }catch(_){}
}
function aiRender(){
  const box=document.getElementById('aiMessages');
  if(!box)return;
  box.innerHTML=aiHistory.map(x=>'<div class="'+(x.role==='user'?'m2':'m1')+' ai-msg">'+esc(x.content)+'</div>').join('');
  box.scrollTop=box.scrollHeight;
}
function aiSetBusy(busy){
  const input=document.getElementById('aiInput'),button=document.getElementById('aiSend');
  if(input)input.disabled=busy;
  if(button)button.disabled=busy;
}
async function aiAsk(raw){
  const message=String(raw||'').trim().slice(0,1000);
  if(!message)return;
  const input=document.getElementById('aiInput');
  if(input)input.value='';
  const previous=aiHistory.filter(x=>x&&['user','assistant'].includes(x.role)).slice(-10);
  aiHistory.push({role:'user',content:message});
  aiRender();aiSaveHistory();aiSetBusy(true);
  const box=document.getElementById('aiMessages');
  if(box){box.insertAdjacentHTML('beforeend','<div class="m1 ai-msg ai-loading" id="aiThinking">Thinking…</div>');box.scrollTop=box.scrollHeight}
  try{
    const rr=await db.functions.invoke('ai-support',{body:{message,history:previous}});
    if(rr.error){
      let detail='';
      try{
        if(rr.error.context&&typeof rr.error.context.clone==='function'){
          const body=await rr.error.context.clone().json();
          detail=body&&body.error?String(body.error):'';
        }
      }catch(_){}
      throw Error(detail||rr.error.message||'AI support is temporarily unavailable.');
    }
    const answer=String(rr.data?.answer||'').trim();
    if(!answer)throw Error('AegisPay AI did not return an answer.');
    aiHistory.push({role:'assistant',content:answer});
    aiSaveHistory();
    const status=document.getElementById('aiOnline');
    if(status)status.textContent=rr.data?.degraded?'● Support mode':'● Online';
  }catch(e){
    aiHistory.push({role:'assistant',content:'Sorry, I could not process that request right now. Please try again in a moment.'});
    aiSaveHistory();
    const status=document.getElementById('aiOnline');
    if(status)status.textContent='● Support available';
  }finally{
    const thinking=document.getElementById('aiThinking');
    if(thinking)thinking.remove();
    aiRender();aiSetBusy(false);
    if(input)input.focus();
  }
}
function bindAiBot(){
  const input=document.getElementById('aiInput'),button=document.getElementById('aiSend');
  if(button&&!button.dataset.bound){
    button.dataset.bound='1';
    button.onclick=()=>aiAsk(input?.value||'');
  }
  if(input&&!input.dataset.bound){
    input.dataset.bound='1';
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiAsk(input.value)}});
  }
}
document.addEventListener('click',function(e){const q=e.target.closest('[data-q]');if(q&&document.getElementById('aiMessages'))aiAsk(q.getAttribute('data-q')||'')});
async function liveBot(){
  if(!profile)return oldGo('login');
  aiLoadHistory();
  app.innerHTML=SC.bot();
  aiRender();
  bindAiBot();
  const input=document.getElementById('aiInput');
  if(input)input.focus();
}

async function bootLive(){try{const qs=new URLSearchParams(location.search);referralLinkCode=String(qs.get('ref')||qs.get('referral')||'').trim().toUpperCase();const hashParams=new URLSearchParams((location.hash||'').replace(/^#/,''));
if(qs.get('shop_purchase')==='confirmed'){
  const shopTaskId=String(qs.get('task')||'').trim();
  const shopProductId=String(qs.get('product')||'').trim();
  history.replaceState({},document.title,location.pathname);
  const shopSession=await db.auth.getSession();
  if(!shopSession.data.session){window.go('login');return;}
  try{
    await initData();
    if(profile.role!=='USER' || !['ACTIVE','NORMAL'].includes(String(profile.status||'').toUpperCase())) throw Error('This account is not active.');
    if(!shopTaskId||!shopProductId) throw Error('Shop purchase confirmation is missing the assigned task or product.');
    const purchase=await db.rpc('record_shop_task_purchase',{p_task_id:shopTaskId,p_product_id:shopProductId});
    if(purchase.error)throw purchase.error;
    await liveShop();
    setTimeout(()=>uiNotice('Shop purchase confirmed. The assigned task is now ready to complete.','success'),0);
  }catch(shopError){
    try{await liveShop();}catch(_){}
    setTimeout(()=>uiNotice(shopError.message||'Shop purchase confirmation could not be recorded.','error'),0);
  }
  return;
}

// Email verification does not need a persistent recovery session; it only confirms the address and returns the client to sign-in.
if(qs.get('verified')==='1'){window.__emailVerified=true;history.replaceState({},document.title,location.pathname);await db.auth.signOut();window.go('login');return}
// Password recovery supports both Supabase PKCE (?code=...) and implicit (#access_token...&type=recovery) return formats.
if(qs.get('reset')==='1' || qs.has('code') || qs.get('type')==='recovery' || hashParams.get('type')==='recovery'){
  const code=qs.get('code');
  if(code){
    const ex=await db.auth.exchangeCodeForSession(code);
    if(ex.error)throw ex.error;
  }else{
    const accessToken=hashParams.get('access_token');
    const refreshToken=hashParams.get('refresh_token');
    if(accessToken&&refreshToken){
      const session=await db.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
      if(session.error)throw session.error;
    }
  }
  const sessionCheck=await db.auth.getSession();
  if(!sessionCheck.data.session)throw Error('This password reset link is invalid or expired. Please request a new reset link.');
  window.go('reset');
  setTimeout(()=>{
    const f=document.getElementById('resetForm');
    if(f)f.onsubmit=async e=>{
      e.preventDefault();
      try{
        const password=document.getElementById('rp').value;
        if(password.length<8)throw Error('Password must contain at least 8 characters.');
        const rr=await db.functions.invoke('complete-password-reset',{body:{password}});
        if(rr.error){
          let detail=null;try{if(rr.error.context&&typeof rr.error.context.clone==='function')detail=await rr.error.context.clone().json();}catch(_){}
          throw Error((detail&&detail.error)||rr.error.message||'Unable to complete password reset.');
        }
        if(!rr.data||rr.data.status!=='PASSWORD_RESET_COMPLETE')throw Error('Password reset could not be completed.');
        history.replaceState({},document.title,location.pathname);
        await db.auth.signOut();
        window.go('login');
        setTimeout(()=>uiNotice('Password updated successfully. Your account is temporarily frozen for security.','success'),0);
      }catch(x){uiNotice(x.message||'Unable to reset password')}
    };
  },0);
  return;
}
if(qs.get('auth-preview')==='1'){window.go((qs.get('signup')==='1'||referralLinkCode)?'signup':'login');return}
const s=await db.auth.getSession();if(s.data.session){await initData();if(profile.role==='USER'){if(!['ACTIVE','NORMAL'].includes(String(profile.status||'').toUpperCase())){await db.auth.signOut();throw Error('This account is not active.');}recordClientAccess('APP_OPEN');return liveHome()}}window.go((referralLinkCode||qs.get('signup')==='1')?'signup':'login')}catch(e){window.go('login')}}
