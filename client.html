function bindTaskImageFallback(root){

   if(mode==='remote'){
    const direct=img.dataset.directSrc||'';

   }
  };

 };
 root.querySelectorAll('img[data-remote-src]').forEach(img=>{

 if(!tasks.length)throw Error('No assigned Shop tasks were found for this cycle.');
 if(tasks.some(x=>String(x.status)==='Completed'))throw Error('This cycle is already partially completed. Please contact Master Admin for reconciliation.');
 const total=tasks.reduce((n,x)=>n+Number(x.task_value||0),0);
 const cycle=await db.from('cycle_runs').select('id,status,cycle_base').eq('id',cycleId).eq('user_id',profile.id).maybeSingle();
 if(cycle.error)throw cycle.error;

      }
    },true);
  }
  const signup=document.getElementById('liveSignup');
  if(signup && !signup.dataset.bound){
    signup.dataset.bound='1';

      e.preventDefault();e.stopPropagation();

      if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent='Creating Account...'}

          email,password:document.getElementById('sp').value,

          preferredLanguage:'en',redirectTo:'https://aegispay-web.aegispay.workers.dev/?verified=1'
        }});
        if(rr.error){
          let serverMessage=rr.data && typeof rr.data==='object' && rr.data.error ? rr.data.error : '';
          const serverCode=rr.data && typeof rr.data==='object' && rr.data.code ? rr.data.code : '';
          if(!serverMessage && rr.error && rr.error.context && typeof rr.error.context.json==='function'){
            try{
              const body=await rr.error.context.clone().json();
              serverMessage=body && body.error ? body.error : '';
            }catch(_){}
          }
          const status=Number(rr.error && (rr.error.status || rr.error.context && rr.error.context.status) || 0);
          if(status===409 || serverCode==='PROFILE_EXISTS' || serverCode==='USERNAME_EXISTS'){
            throw Error(serverMessage || 'This email or username is already registered. Please use a different email or username.');
          }
          const msg=serverMessage || rr.error.message || 'Signup failed. Please try again.';
          if(serverCode==='EMAIL_DELIVERY_FAILED' || /email verification service|confirmation email|email delivery/i.test(msg)){
            throw Error('Email verification service is temporarily unavailable. Please try again after the email service is fixed.');
          }
          throw Error(msg);
        }
        app.innerHTML=SC.verifyPending(email);
        bindAuthForms();
        const rb=document.getElementById('resendVerify');
        if(rb)rb.onclick=async()=>{
          try{
            rb.disabled=true;rb.textContent='Sending...';
            const r=await db.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://aegispay-web.aegispay.workers.dev/?verified=1'}});
            if(r.error)throw r.error;

          }catch(x){rb.disabled=false;rb.textContent='Resend Verification Email';uiNotice(x.message||'Unable to resend verification email.')}
        };
      }catch(x){
        uiNotice(x.message||'Signup failed');
        if(button){button.disabled=false;button.textContent=button.dataset.originalText||'Sign Up'}
      }
    },true);
  }
}

const AI_HISTORY_KEY='aegispay_ai_history_v2';
let aiHistory=[];

function aiLoadHistory(){
  try{
    const key=AI_HISTORY_KEY+':'+String(profile?.id||'guest');
    const raw=sessionStorage.getItem(key);
    const parsed=raw?JSON.parse(raw):[];
    aiHistory=Array.isArray(parsed)?parsed.filter(x=>x&&['user','assistant'].includes(x.role)&&typeof x.content==='string').slice(-20):[];
  }catch(_){aiHistory=[]}
  if(!Array.isArray(aiHistory))aiHistory=[];
}
function aiSaveHistory(){
  try{
    const key=AI_HISTORY_KEY+':'+String(profile?.id||'guest');
    sessionStorage.setItem(key,JSON.stringify(aiHistory.slice(-20)));
  }catch(_){}
}
function aiRender(){
  const box=document.getElementById('aiMessages');
  if(!box)return;
  box.innerHTML=aiHistory.map(x=>'<div class="'+(x.role==='user'?'m2':'m1')+' ai-msg">'+esc(x.content)+'</div>').join('');
  box.scrollTop=box.scrollHeight;
}
function aiSetBusy(busy){
  const input=document.getElementById('aiInput'),button=document.getElementById('aiSend');
  if(input)input.disabled=busy;
  if(button)button.disabled=busy;
}
async function aiAsk(raw){
  const message=String(raw||'').trim().slice(0,1000);
  if(!message)return;
  const input=document.getElementById('aiInput');
  if(input)input.value='';
  const previous=aiHistory.filter(x=>x&&['user','assistant'].includes(x.role)).slice(-10);
  aiHistory.push({role:'user',content:message});
  aiRender();aiSaveHistory();aiSetBusy(true);
  const box=document.getElementById('aiMessages');
  if(box){box.insertAdjacentHTML('beforeend','<div class="m1 ai-msg ai-loading" id="aiThinking">Thinking…</div>');box.scrollTop=box.scrollHeight}
  try{
    const rr=await db.functions.invoke('ai-support',{body:{message,history:previous}});
    if(rr.error){
      let detail='';
      try{
        if(rr.error.context&&typeof rr.error.context.clone==='function'){
          const body=await rr.error.context.clone().json();
          detail=body&&body.error?String(body.error):'';
        }
      }catch(_){}
      throw Error(detail||rr.error.message||'AI support is temporarily unavailable.');
    }
    const answer=String(rr.data?.answer||'').trim();
    if(!answer)throw Error('AegisPay AI did not return an answer.');
    aiHistory.push({role:'assistant',content:answer});
    aiSaveHistory();
    const status=document.getElementById('aiOnline');
    if(status)status.textContent=rr.data?.degraded?'● Support mode':'● Online';
  }catch(e){
    aiHistory.push({role:'assistant',content:'Sorry, I could not process that request right now. Please try again in a moment.'});
    aiSaveHistory();
    const status=document.getElementById('aiOnline');
    if(status)status.textContent='● Support available';
  }finally{
    const thinking=document.getElementById('aiThinking');
    if(thinking)thinking.remove();
    aiRender();aiSetBusy(false);
    if(input)input.focus();
  }
}
function bindAiBot(){
  const input=document.getElementById('aiInput'),button=document.getElementById('aiSend');
  if(button&&!button.dataset.bound){
    button.dataset.bound='1';
    button.onclick=()=>aiAsk(input?.value||'');
  }
  if(input&&!input.dataset.bound){
    input.dataset.bound='1';
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiAsk(input.value)}});
  }
}
async function liveBot(){
  if(!profile)return oldGo('login');
  aiLoadHistory();
  app.innerHTML=SC.bot();
  aiRender();
  bindAiBot();
  const input=document.getElementById('aiInput');
  if(input)input.focus();
}

if(qs.get('shop_purchase')==='confirmed'){

if(qs.get('verified')==='1'){window.__emailVerified=true;history.replaceState({},document.title,location.pathname);await db.auth.signOut();window.go('login');return}
// Password recovery supports both Supabase PKCE (?code=...) and implicit (#access_token...&type=recovery) return formats.
if(qs.get('reset')==='1' || qs.has('code') || qs.get('type')==='recovery' || hashParams.get('type')==='recovery'){
  const code=qs.get('code');
  if(code){
    const ex=await db.auth.exchangeCodeForSession(code);
    if(ex.error)throw ex.error;
  }else{
    const accessToken=hashParams.get('access_token');
    const refreshToken=hashParams.get('refresh_token');
    if(accessToken&&refreshToken){
      const session=await db.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
      if(session.error)throw session.error;
    }
  }
  const sessionCheck=await db.auth.getSession();
  if(!sessionCheck.data.session)throw Error('This password reset link is invalid or expired. Please request a new reset link.');
  window.go('reset');
  setTimeout(()=>{
    const f=document.getElementById('resetForm');

          let detail=null;try{if(rr.error.context&&typeof rr.error.context.clone==='function')detail=await rr.error.context.clone().json();}catch(_){}
          throw Error((detail&&detail.error)||rr.error.message||'Unable to complete password reset.');
        }
        if(!rr.data||rr.data.status!=='PASSWORD_RESET_COMPLETE')throw Error('Password reset could not be completed.');
        history.replaceState({},document.title,location.pathname);
        await db.auth.signOut();
        window.go('login');
        setTimeout(()=>uiNotice('Password updated successfully. Your account is temporarily frozen for security.','success'),0);
      }catch(x){uiNotice(x.message||'Unable to reset password')}
    };
  },0);
  return;
}

      return;

    app.innerHTML=top('Withdraw')+'<div class="p2-balance"><small>Available to withdraw</small><h2>'+available.toFixed(2)+' <span>USDT</span></h2><div class="sub">Total '+total.toFixed(2)+' · Held '+held.toFixed(2)+' USDT</div></div><div class="p2-card"><div class="p2-head"><h2>Withdrawal Details</h2><span>TRC20</span></div><div class="ap-field"><label>Amount</label><input id="wAmount" type="number" min="'+(rules.minimum||50)+'" max="'+available.toFixed(2)+'" step=".01" inputmode="decimal" placeholder="Minimum '+Number(rules.minimum||50).toFixed(2)+' USDT"></div><div class="p2-wallet"><span class="bub" style="background:rgba(34,211,238,.12);color:var(--c)">'+ic('link')+'</span><code>'+esc(p.destination_address)+'</code><span class="chip">Locked</span></div><div class="p2-mini-grid" style="margin-top:10px"><div class="p2-mini"><small>Network</small><b>TRC20</b></div><div class="p2-mini"><small>Fee</small><b>'+Number(rules.fee||0).toFixed(2)+' USDT</b></div></div><button class="btn" style="margin-top:12px" id="wBtn">Request Withdrawal '+ic('arrow')+'</button><div id="withdrawInlineStatus"></div></div><div class="p2-card"><div class="p2-head"><h2>Approval Flow</h2><span>Protected</span></div><div class="p2-step"><span class="n">1</span><div><b>Submit request</b><small>Available balance is checked first.</small></div></div><div class="p2-step"><span class="n">2</span><div><b>Master Admin review</b><small>The request enters the secure approval queue.</small></div></div><div class="p2-step"><span class="n">3</span><div><b>Processing</b><small>Final payout processing follows the approved workflow.</small></div></div></div>'+nav('wallet');
    wBtn.onclick=async function(){
      const box=document.getElementById('withdrawInlineStatus');
      try{const amount=Number(wAmount.value);if(!Number.isFinite(amount)||amount<Number(rules.minimum||50))throw Error('Enter an amount above the minimum withdrawal.');if(amount>available)throw Error('Withdrawal amount exceeds your available balance.');const x=await db.rpc('request_withdrawal',{p_amount:amount});if(x.error)throw x.error;const tg=await db.functions.invoke('telegram-withdrawal',{body:{action:'notify',withdrawalId:x.data}});if(box)box.innerHTML='<div class="p2-status green" style="margin-top:10px;margin-bottom:0"><span class="dot"></span><div><b>Withdrawal submitted</b><small>'+esc(tg.error?'Request created; Telegram alert needs attention.':'Your request is waiting for Master Admin approval.')+'</small></div></div>';}catch(e){if(box)box.innerHTML='<div class="p2-status error" style="margin-top:10px;margin-bottom:0"><span class="dot"></span><div><b>Withdrawal not submitted</b><small>'+esc(e.message||'Withdrawal failed.')+'</small></div></div>'}
    };
  };

  liveActivity=async function(){
    const p=profile,q=await Promise.all([db.from('account_ledger').select('entry_type,amount,description,created_at').eq('user_id',p.id).order('created_at',{ascending:false}).limit(100),db.from('withdrawal_requests').select('amount,status,created_at,net_amount').eq('user_id',p.id).order('created_at',{ascending:false}).limit(100),db.from('referrals').select('referral_level,platform_reward,created_at,referred_user_id').eq('user_id',p.id).order('created_at',{ascending:false}).limit(100)]);
    if(q[0].error||q[1].error||q[2].error){uiNotice('Unable to load activity history.','error');return;}
    const ledger=q[0].data||[],withdrawals=q[1].data||[],referrals=q[2].data||[];
    const sum=function(a){return a.reduce(function(n,x){return n+Math.abs(Number(x.amount||x.platform_reward||0));},0);};
    const deposits=ledger.filter(function(x){return Number(x.amount)>0&&!/profit|task|referral|reward/i.test((x.entry_type||'')+' '+(x.description||''));}),profits=ledger.filter(function(x){return Number(x.amount)>0&&/profit|task/i.test((x.entry_type||'')+' '+(x.description||''));});
    let current='overview';
    const listBox='<div id="activityList"></div>';
    const card=function(key,title,value,icon,color){return '<button type="button" class="p2-card compact" data-activity-tab="'+key+'" style="width:100%;text-align:left;border-color:'+color+'44"><div class="p2-row"><span class="bub" style="background:'+color+'18;color:'+color+'">'+ic(icon)+'</span><div class="grow"><h3>'+title+'</h3><small>Open history</small></div><div class="p2-amount">'+Number(value).toFixed(2)+'<small>USDT · View</small></div></div></button>';};
    const render=function(key){
      current=key;const box=document.getElementById('activityList');if(!box)return;
      let html='';
      if(key==='overview')html='<div class="p2-card compact"><div class="p2-step"><span class="n">1</span><div><b>Deposits</b><small>Successful account credits and submitted deposit history.</small></div></div><div class="p2-step"><span class="n">2</span><div><b>Withdrawals</b><small>Requested, approved and processed withdrawal activity.</small></div></div><div class="p2-step"><span class="n">3</span><div><b>Task Profit</b><small>Recorded Shop/task earnings.</small></div></div><div class="p2-step"><span class="n">4</span><div><b>Referral Rewards</b><small>Level-based referral reward records.</small></div></div></div>';
      else if(key==='deposit')html=deposits.length?deposits.map(function(x){return '<div class="row"><div>'+esc(x.description||x.entry_type)+'<small>'+new Date(x.created_at).toLocaleString()+'</small></div><em class="up">+'+Number(x.amount||0).toFixed(2)+'<small>USDT</small></em></div>';}).join(''):'<div class="p2-empty"><b>No deposit records</b>Successful credits will appear here.</div>';
      else if(key==='withdrawal')html=withdrawals.length?withdrawals.map(function(x){return '<div class="row"><div>Withdrawal<small>'+esc(x.status||'REQUESTED')+' · '+new Date(x.created_at).toLocaleString()+'</small></div><em class="dn">−'+Number(x.net_amount||x.amount||0).toFixed(2)+'<small>USDT</small></em></div>';}).join(''):'<div class="p2-empty"><b>No withdrawals yet</b>Your withdrawal requests will appear here.</div>';
      else if(key==='profit')html=profits.length?profits.map(function(x){return '<div class="row"><div>'+esc(x.description||x.entry_type)+'<small>'+new Date(x.created_at).toLocaleString()+'</small></div><em class="up">+'+Number(x.amount||0).toFixed(2)+'<small>USDT</small></em></div>';}).join(''):'<div class="p2-empty"><b>No task profit yet</b>Completed Shop earnings will appear here.</div>';
      else if(key==='referral')html=referrals.length?referrals.map(function(x){return '<div class="row"><div>Referral Reward<small>Level '+esc(x.referral_level)+' · '+new Date(x.created_at).toLocaleString()+'</small></div><em class="up">+'+Number(x.platform_reward||0).toFixed(2)+'<small>USDT</small></em></div>';}).join(''):'<div class="p2-empty"><b>No referral rewards yet</b>New rewards will appear here.</div>';
      box.innerHTML='<div class="p2-card compact">'+html+'</div>';
    };
    app.innerHTML=top('Activity')+'<div class="p2-head"><h2>Account Overview</h2><span>Live ledger</span></div><div class="p2-mini-grid"><div class="p2-mini"><small>Total Credits</small><b>+'+sum(deposits).toFixed(2)+'</b></div><div class="p2-mini"><small>Withdrawals</small><b>−'+sum(withdrawals).toFixed(2)+'</b></div><div class="p2-mini"><small>Task Profit</small><b>+'+sum(profits).toFixed(2)+'</b></div><div class="p2-mini"><small>Referral Rewards</small><b>+'+sum(referrals).toFixed(2)+'</b></div></div><div class="p2-head" style="margin-top:17px"><h2>History</h2><span>Tap a category</span></div>'+card('deposit','Deposits',sum(deposits),'dl','#2EE6A6')+card('withdrawal','Withdrawals',sum(withdrawals),'up','#FF5C7A')+card('profit','Task Profit',sum(profits),'check','#FFB84D')+card('referral','Referral Rewards',sum(referrals),'gift','#7C5CFF')+listBox+nav('activity');
    document.querySelectorAll('[data-activity-tab]').forEach(function(el){el.onclick=function(){render(el.getAttribute('data-activity-tab')||'overview');};});
    render(current);
  };

  window.go=async function(id){
    try{
      if(id==='login'||id==='signup'||id==='forgot'||id==='reset'){const rr=oldGo(id);setTimeout(bindAuthForms,0);return rr;}
      if(!profile)return oldGo('login');
      if(id==='bot')return liveBot();if(id==='home')return liveHome();if(id==='wallet'||id==='assets')return liveAssets();if(id==='earn'||id==='tasks'||id==='shop')return liveShop();
      if(id==='topup')return liveTopup();if(id==='withdraw')return liveWithdraw();if(id==='referral')return liveReferral();if(id==='activity')return liveActivity();if(id==='profile'||id==='account')return liveAccount();if(id==='notifications')return liveNotifications();
      return oldGo(id);
    }catch(e){app.innerHTML='<div class="p2-card" style="margin-top:30px"><div class="p2-status error"><span class="dot"></span><div><b>Unable to load this section</b><small>'+esc(e.message||'Please try again.')+'</small></div></div>'+nav('home')+'</div>';}finally{setTimeout(updateNotificationBadge,0);}
  };
})();
bindTaskDelegation();window.liveLogout=liveLogout;updateNotificationBadge();bootLive();
})();
</script>
<script src="./app-update.js"></script>
</body>
