name: AegisPay Shasta UI Preview

on:
  push:
    branches:
      - feat/step2-shasta-deposit-e2e
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegispay-shasta-preview
  cancel-in-progress: true

jobs:
  deploy-shasta-preview:
    if: github.ref == 'refs/heads/feat/step2-shasta-deposit-e2e'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "6a31dfe877fe64e588b9415265302af4"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for pinned browser SDK
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare the pinned Supabase browser SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @supabase/supabase-js@2.117.2
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js supabase-sdk.js
          test -s supabase-sdk.js

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Run AegisPay repository checks
        run: npm run check

      - name: Diagnose the configured Turnstile widget hostname allowlist
        shell: bash
        env:
          TURNSTILE_SITEKEY: "0x4AAAAAAFZaOeTke8FQpVNS"
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets?per_page=100&page=1"
          if ! curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" -o /tmp/turnstile-widgets.json; then
            echo "::warning::Turnstile widget configuration could not be read by this token; no security settings were changed."
            exit 0
          fi
          jq --arg key "$TURNSTILE_SITEKEY" '[.result[]? | select(.sitekey == $key) | {id: (.id // .sitekey), name, domains}]' /tmp/turnstile-widgets.json > /tmp/turnstile-target.json
          jq '{matchingWidgetCount:length, widgets:map({id, name, domains})}' /tmp/turnstile-target.json
          count="$(jq 'length' /tmp/turnstile-target.json)"
          if [ "$count" -eq 0 ]; then
            echo "::warning::Configured sitekey was not found in this Cloudflare account. Check that the page sitekey matches its Turnstile widget."
            exit 0
          fi
          jq -e '.[0].domains | any(. == "aegispay-pro.pages.dev" or . == "shasta-test-ui.aegispay-pro.pages.dev")' /tmp/turnstile-target.json >/dev/null || echo "::warning::The current AegisPay Shasta preview hostname is not explicitly covered by this widget's configured domains."
      
      - name: Assemble Shasta-aware portal preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app
          mkdir -p site/app
          cp client.html site/client.html
          cp master-admin.html site/master-admin.html
          cp admin-auth.js site/admin-auth.js
          cp client.html site/app/index.html
          cp client.html site/app/home.html
          cp _redirects site/_redirects
          cp _headers site/_headers
          cp shop-catalog.js supabase-sdk.js supabase-client.js supabase-service.js aegis-auth-redirect.js aegis-turnstile.js app-update.js service-worker.js manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/
          cp supabase-sdk.js supabase-client.js supabase-service.js aegis-auth-redirect.js aegis-turnstile.js app-update.js service-worker.js manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/app/
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app/home.html
          grep -q "TRON SHASTA TESTNET" site/app/index.html
          grep -q "USDT contract" site/app/index.html
          grep -q "aegispay-shell-v36-shasta-network-aware" site/app/service-worker.js

      - name: Deploy only the Shasta UI preview to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy site --project-name=aegispay-pro --branch=shasta-test-ui --commit-hash="${GITHUB_SHA}" --commit-message="AegisPay Shasta-aware deposit UI preview" --commit-dirty=false

      - name: Smoke-test the published Shasta UI preview
        shell: bash
        run: |
          set -euo pipefail
          url="https://shasta-test-ui.aegispay-pro.pages.dev/app/"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/shasta-ui-preview.html; then
              break
            fi
            sleep 5
          done
          test -s /tmp/shasta-ui-preview.html
          grep -q "TRON SHASTA TESTNET" /tmp/shasta-ui-preview.html
          grep -q "result.data.tokenContract" /tmp/shasta-ui-preview.html
          curl --fail --silent --show-error --location --max-time 20 "https://shasta-test-ui.aegispay-pro.pages.dev/app/service-worker.js" -o /tmp/shasta-preview-service-worker.js
          grep -q "aegispay-shell-v36-shasta-network-aware" /tmp/shasta-preview-service-worker.js

      - name: Smoke-test Master Admin manual Shasta review controls
        shell: bash
        run: |
          set -euo pipefail
          base="https://shasta-test-ui.aegispay-pro.pages.dev"
          curl --fail --silent --show-error --location --max-time 20 "$base/master-admin.html" -o /tmp/shasta-master-admin.html
          curl --fail --silent --show-error --location --max-time 20 "$base/admin-auth.js" -o /tmp/shasta-admin-auth.js
          test -s /tmp/shasta-master-admin.html
          grep -q "admin-auth.js" /tmp/shasta-master-admin.html
          grep -q "aegis-turnstile.js?v=20261021-turnstile-timeout-fix" /tmp/shasta-master-admin.html
          grep -q "manualShastaCredit" /tmp/shasta-admin-auth.js
          grep -q "Master Admin Manual Verify + Credit (Shasta)" /tmp/shasta-admin-auth.js
          curl --fail --silent --show-error --location --max-time 20 "$base/aegis-turnstile.js?v=20261021-turnstile-timeout-fix" -o /tmp/shasta-turnstile.js
          grep -q "var VERIFY_ATTEMPT_TIMEOUT_MS = 45000" /tmp/shasta-turnstile.js
          grep -q "Cloudflare does not authorize this hostname" /tmp/shasta-turnstile.js
          curl --fail --silent --show-error --location --max-time 20 -D /tmp/shasta-admin-headers.txt "$base/master-admin.html" -o /dev/null
          grep -qi "Cache-Control: no-store" /tmp/shasta-admin-headers.txt
