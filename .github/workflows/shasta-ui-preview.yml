name: AegisPay Shasta UI Preview

on:
  push:
    branches:
      - feat/step2-shasta-deposit-e2e
      - feat/shasta-step2-main-sync-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegispay-shasta-preview
  cancel-in-progress: true

jobs:
  deploy-shasta-preview:
    if: github.ref == 'refs/heads/feat/step2-shasta-deposit-e2e' || github.ref == 'refs/heads/feat/shasta-step2-main-sync-20261022'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: "6a31dfe877fe64e588b9415265302af4"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for pinned browser SDK
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare the pinned Supabase browser SDK
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @supabase/supabase-js@2.117.2
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js supabase-sdk.js
          test -s supabase-sdk.js

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
          test -n "${CLOUDFLARE_API_TOKEN}"

      - name: Run AegisPay repository checks
        run: npm run check

      - name: Ensure exact Shasta preview hostname is authorized in Turnstile
        shell: bash
        env:
          TURNSTILE_SITEKEY: "0x4AAAAAAFZaOeTke8FQpVNS"
          TURNSTILE_PREVIEW_HOST: "shasta-test-ui.aegispay-pro.pages.dev"
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/challenges/widgets/${TURNSTILE_SITEKEY}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if ! curl --fail --silent --show-error --max-time 20 "${auth[@]}" "$api" -o /tmp/turnstile-widget.json; then
            echo "::error::Unable to read the configured Turnstile widget. No sign-in security setting was bypassed."
            exit 1
          fi
          jq -e --arg key "$TURNSTILE_SITEKEY" '.success == true and .result.sitekey == $key and (.result.domains|type == "array") and (.result.mode|type == "string") and (.result.name|type == "string")' /tmp/turnstile-widget.json >/dev/null
          if ! jq -e --arg host "$TURNSTILE_PREVIEW_HOST" '.result.domains | index($host) != null' /tmp/turnstile-widget.json >/dev/null; then
            jq --arg host "$TURNSTILE_PREVIEW_HOST" '
              .result as $r |
              {name:$r.name, mode:$r.mode, domains: (($r.domains // []) + [$host] | unique)}
              + (if $r.bot_fight_mode != null then {bot_fight_mode:$r.bot_fight_mode} else {} end)
              + (if $r.clearance_level != null then {clearance_level:$r.clearance_level} else {} end)
              + (if $r.ephemeral_id != null then {ephemeral_id:$r.ephemeral_id} else {} end)
              + (if $r.offlabel != null then {offlabel:$r.offlabel} else {} end)
            ' /tmp/turnstile-widget.json > /tmp/turnstile-update.json
            curl --fail --silent --show-error --max-time 20 "${auth[@]}" -H "Content-Type: application/json" -X PUT --data-binary @/tmp/turnstile-update.json "$api" -o /tmp/turnstile-updated.json
            jq -e '.success == true' /tmp/turnstile-updated.json >/dev/null
          fi
          curl --fail --silent --show-error --max-time 20 "${auth[@]}" "$api" -o /tmp/turnstile-verify.json
          jq -e --arg host "$TURNSTILE_PREVIEW_HOST" '.success == true and (.result.domains | index($host) != null)' /tmp/turnstile-verify.json >/dev/null
          jq '{name:.result.name, mode:.result.mode, domains:.result.domains}' /tmp/turnstile-verify.json

      - name: Assemble Shasta-aware portal preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/app
          mkdir -p site/app
          cp client.html site/client.html
          cp master-admin.html site/master-admin.html
          cp admin-auth.js site/admin-auth.js
          cp client.html site/app/index.html
          cp client.html site/app/home.html
          cp _redirects site/_redirects
          cp _headers site/_headers
          cp shop-catalog.js supabase-sdk.js supabase-client.js supabase-service.js aegis-auth-redirect.js aegis-turnstile.js app-update.js service-worker.js manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/
          cp supabase-sdk.js supabase-client.js supabase-service.js aegis-auth-redirect.js aegis-turnstile.js app-update.js service-worker.js manifest.webmanifest aegispay-logo.svg aegispay-logo-light.svg site/app/
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app/home.html
          grep -q "TRON SHASTA TESTNET" site/app/index.html
          grep -q "USDT contract" site/app/index.html
          grep -q "aegispay-shell-v48-shasta-deposit-e2e" site/app/service-worker.js

      - name: Deploy only the Shasta UI preview to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy site --project-name=aegispay-pro --branch=shasta-test-ui --commit-hash="${GITHUB_SHA}" --commit-message="AegisPay Shasta-aware deposit UI preview" --commit-dirty=false

      - name: Smoke-test the published Shasta UI preview
        shell: bash
        run: |
          set -euo pipefail
          url="https://shasta-test-ui.aegispay-pro.pages.dev/app/"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/shasta-ui-preview.html; then
              break
            fi
            sleep 5
          done
          test -s /tmp/shasta-ui-preview.html
          grep -q "TRON SHASTA TESTNET" /tmp/shasta-ui-preview.html
          grep -q "row.tokenContract" /tmp/shasta-ui-preview.html
          grep -q "scan-deposit-txid" /tmp/shasta-ui-preview.html
grep -q "allowShastaTxidless" /tmp/shasta-ui-preview.html
          grep -q "Verify from TronGrid" /tmp/shasta-ui-preview.html
          curl --fail --silent --show-error --location --max-time 20 "https://shasta-test-ui.aegispay-pro.pages.dev/app/service-worker.js" -o /tmp/shasta-preview-service-worker.js
          grep -q "aegispay-shell-v48-shasta-deposit-e2e" /tmp/shasta-preview-service-worker.js

      - name: Smoke-test Master Admin manual Shasta review controls
        shell: bash
        run: |
          set -euo pipefail
          base="https://shasta-test-ui.aegispay-pro.pages.dev"
          curl --fail --silent --show-error --location --max-time 20 "$base/master-admin.html" -o /tmp/shasta-master-admin.html
          curl --fail --silent --show-error --location --max-time 20 "$base/admin-auth.js" -o /tmp/shasta-admin-auth.js
          test -s /tmp/shasta-master-admin.html
          grep -q "admin-auth.js?v=20261021-simple-admin-deposit-approval" /tmp/shasta-master-admin.html
          grep -q "aegis-turnstile.js?v=20261021-turnstile-timeout-stability" /tmp/shasta-master-admin.html
          grep -q 'data-decision="approve">Approve' /tmp/shasta-admin-auth.js
          grep -q 'data-decision="reject">Reject' /tmp/shasta-admin-auth.js
          curl --fail --silent --show-error --location --max-time 20 "$base/aegis-turnstile.js?v=20261021-turnstile-timeout-stability" -o /tmp/shasta-turnstile.js
          grep -q "var VERIFY_ATTEMPT_TIMEOUT_MS = 30000" /tmp/shasta-turnstile.js
          grep -q "var VERIFY_RETRY_LIMIT = 1" /tmp/shasta-turnstile.js
          # Current main uses the automatic challenge with one bounded retry.
          grep -q "does not authorize this website hostname (110200)" /tmp/shasta-turnstile.js
          curl --fail --silent --show-error --location --max-time 20 -D /tmp/shasta-admin-headers.txt "$base/master-admin.html" -o /dev/null
          grep -qi "Cache-Control: no-store" /tmp/shasta-admin-headers.txt
