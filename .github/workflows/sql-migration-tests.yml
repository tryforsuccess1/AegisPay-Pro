name: AegisPay SQL Migration Tests

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'scripts/sql-tests/deposit_txid_optional_assertions.sql'
      - 'scripts/sql-tests/deposit_evidence_dedupe_assertions.sql'
      - 'supabase/functions/monitor-deposits/index.ts'
      - 'supabase/functions/submit-deposit/index.ts'
      - 'supabase/functions/get-deposit-address/index.ts'
      - 'supabase/functions/_shared/tron-hd-wallet.ts'
      - 'supabase/functions/_shared/tron-hd-wallet_test.ts'
      - 'supabase/functions/_shared/tron-sweep.ts'
      - 'supabase/functions/_shared/tron-sweep_test.ts'
      - 'supabase/functions/_shared/tron-deposit-validation.ts'
      - 'supabase/functions/_shared/tron-deposit-validation_test.ts'
      - 'supabase/functions/_shared/shasta-test-mode.ts'
      - 'supabase/functions/_shared/shasta-test-mode_test.ts'
      - 'supabase/functions/sweep-deposit-wallets/index.ts'
      - 'supabase/functions/verify-deposit/index.ts'
      - 'supabase/functions/execute-payout/index.ts'
      - 'scripts/sql-tests/**'
      - 'scripts/validate-static.js'
      - '.github/workflows/sql-migration-tests.yml'
  push:
    branches: [main, feat/step2-shasta-deposit-e2e]
    paths:
      - 'database/migrations/**'
      - 'scripts/sql-tests/deposit_txid_optional_assertions.sql'
      - 'scripts/sql-tests/deposit_evidence_dedupe_assertions.sql'
      - 'supabase/functions/monitor-deposits/index.ts'
      - 'supabase/functions/submit-deposit/index.ts'
      - 'supabase/functions/get-deposit-address/index.ts'
      - 'supabase/functions/_shared/tron-hd-wallet.ts'
      - 'supabase/functions/_shared/tron-hd-wallet_test.ts'
      - 'supabase/functions/_shared/tron-sweep.ts'
      - 'supabase/functions/_shared/tron-sweep_test.ts'
      - 'supabase/functions/_shared/tron-deposit-validation.ts'
      - 'supabase/functions/_shared/tron-deposit-validation_test.ts'
      - 'supabase/functions/_shared/shasta-test-mode.ts'
      - 'supabase/functions/_shared/shasta-test-mode_test.ts'
      - 'supabase/functions/sweep-deposit-wallets/index.ts'
      - 'supabase/functions/verify-deposit/index.ts'
      - 'supabase/functions/execute-payout/index.ts'
      - 'scripts/sql-tests/**'
      - 'scripts/validate-static.js'
      - '.github/workflows/sql-migration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deposit-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aegispay_test
          POSTGRES_USER: aegispay_test
          POSTGRES_PASSWORD: local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegispay_test -d aegispay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: aegispay_test
      PGUSER: aegispay_test
      PGPASSWORD: local-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify disposable PostgreSQL is ready
        run: |
          psql --version
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
      - name: Create minimal fixture schema
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_migration_fixture.sql
      - name: Apply deposit migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261013_fix_deposit_enablement_gate_and_txid_uniqueness.sql
      - name: Apply HD deposit-wallet migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261017150927_hd_deposit_wallets_20261016120000.sql
      - name: Verify HD deposit-wallet RLS, uniqueness, and privileges
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/hd_deposit_wallets_assertions.sql
      - name: Apply HD sweep journal migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261017150938_hd_deposit_sweep_journal_20261017100000.sql
      - name: Apply Shasta deposit credit guard migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261020180500_harden_shasta_deposit_credit.sql
      - name: Isolate Shasta test credits from Mainnet account side effects
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261021100000_isolate_shasta_test_credit_side_effects.sql
      - name: Allow Shasta screenshot-first deposits with canonical TXID fallback
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261021120000_allow_shasta_deposit_txid_fallback.sql
      - name: Verify nullable TXID and uniqueness schema
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_txid_optional_assertions.sql
      - name: Prevent reuse of the same deposit screenshot
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261021140000_dedupe_shasta_deposit_screenshots.sql
      - name: Restrict submitted-TXID deduplication to valid Shasta hashes
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261021150000_limit_shasta_txid_hint_index.sql
      - name: Verify duplicate screenshot and submitted-TXID protection
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_evidence_dedupe_assertions.sql
      - name: Apply duplicate-TXID abuse guard migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261022103000_deposit_duplicate_txid_abuse_guard.sql
      - name: Apply second-strike duplicate-TXID block migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261022111500_block_second_duplicate_txid_attempt.sql
      - name: Verify duplicate-TXID warning and block threshold
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_duplicate_txid_abuse_assertions.sql
      - name: Verify HD sweep idempotency and restricted access
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/hd_deposit_sweep_assertions.sql
      - name: Verify deposit idempotency, permissions, referral settings, and safe gates
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_migration_assertions.sql
      - name: Create disposable cron, Vault, and pg_net stubs
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_monitor_cron_fixture.sql
      - name: Apply guarded deposit monitor cron migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261015222625_deposit_monitor_skip_when_gates_closed.sql
      - name: Verify cron skips requests while gates are closed and dispatches only when gates are open
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_monitor_cron_assertions.sql
      - name: Apply Master Admin testnet manual approval migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261021_master_admin_testnet_manual_deposit_approval.sql
      - name: Verify simple Master Admin approve/reject credit flow
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/manual_testnet_deposit_approval_assertions.sql
