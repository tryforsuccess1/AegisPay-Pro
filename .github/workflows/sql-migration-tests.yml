name: AegisPay SQL Migration Tests

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'supabase/functions/monitor-deposits/index.ts'
      - 'supabase/functions/submit-deposit/index.ts'
      - 'supabase/functions/get-deposit-address/index.ts'
      - 'supabase/functions/_shared/tron-hd-wallet.ts'
      - 'supabase/functions/_shared/tron-hd-wallet_test.ts'
      - 'supabase/functions/verify-deposit/index.ts'
      - 'supabase/functions/execute-payout/index.ts'
      - 'scripts/sql-tests/deposit_monitor_cron_fixture.sql'
      - 'scripts/sql-tests/deposit_monitor_cron_assertions.sql'
      - 'scripts/sql-tests/**'
      - 'scripts/validate-static.js'
      - '.github/workflows/sql-migration-tests.yml'
  push:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'supabase/functions/monitor-deposits/index.ts'
      - 'supabase/functions/submit-deposit/index.ts'
      - 'supabase/functions/get-deposit-address/index.ts'
      - 'supabase/functions/_shared/tron-hd-wallet.ts'
      - 'supabase/functions/_shared/tron-hd-wallet_test.ts'
      - 'supabase/functions/verify-deposit/index.ts'
      - 'supabase/functions/execute-payout/index.ts'
      - 'scripts/sql-tests/deposit_monitor_cron_fixture.sql'
      - 'scripts/sql-tests/deposit_monitor_cron_assertions.sql'
      - 'scripts/sql-tests/**'
      - 'scripts/validate-static.js'
      - '.github/workflows/sql-migration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deposit-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: aegispay_test
          POSTGRES_USER: aegispay_test
          POSTGRES_PASSWORD: local-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegispay_test -d aegispay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: aegispay_test
      PGUSER: aegispay_test
      PGPASSWORD: local-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify disposable PostgreSQL is ready
        run: |
          psql --version
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
      - name: Create minimal fixture schema
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_migration_fixture.sql
      - name: Apply deposit migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261013_fix_deposit_enablement_gate_and_txid_uniqueness.sql
      - name: Apply HD deposit-wallet migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261016120000_hd_deposit_wallets.sql
      - name: Verify HD deposit-wallet RLS, uniqueness, and privileges
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/hd_deposit_wallets_assertions.sql
      - name: Verify deposit idempotency, permissions, referral settings, and safe gates
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_migration_assertions.sql
      - name: Create disposable cron, Vault, and pg_net stubs
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_monitor_cron_fixture.sql
      - name: Apply guarded deposit monitor cron migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261015222625_deposit_monitor_skip_when_gates_closed.sql
      - name: Verify cron skips requests while gates are closed and dispatches only when gates are open
        run: psql -v ON_ERROR_STOP=1 -f scripts/sql-tests/deposit_monitor_cron_assertions.sql
