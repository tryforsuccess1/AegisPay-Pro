name: AegisPay CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: aegispay-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository checks
        run: npm run check
      - name: Syntax-check live production browser smoke test
        run: node --check scripts/client-live-smoke.cjs
      - name: Install browser smoke-test dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0 @supabase/supabase-js@2.117.2
      - name: Prepare the pinned Supabase browser SDK for local smoke testing
        run: |
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js supabase-sdk.js
          test -s supabase-sdk.js
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Test login controls and responsive client UI in Chromium
        run: node scripts/client-browser-smoke.cjs
      - name: Smoke-test deployed production landing, Client and Master Admin
        env:
          AEGIS_LIVE_URL: https://aegispay-pro.pages.dev
        run: node scripts/client-live-smoke.cjs
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts
      - name: Test breached password security helper
        run: deno test supabase/functions/_shared/pwned-passwords_test.ts
      - name: Bundle Shop Worker without deploying
        run: npx --yes wrangler@4 deploy --config workers/aegispay-shopping/wrangler.jsonc --dry-run --outdir=/tmp/aegispay-shopping-bundle
