name: AegisPay CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: aegispay-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository checks
        run: npm run check
      - name: Bundle Shop Worker without deploying
        run: npx --yes wrangler@4 deploy --config workers/aegispay-shopping/wrangler.jsonc --dry-run --outdir=/tmp/aegispay-shopping-bundle
