name: AegisPay Aurora APK Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aegispay-aurora-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  publish-aurora-debug-main:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build canonical Aurora Client debug APK
        run: gradle -p android :app:assembleClientDebug :app:bundleClientDebug --no-daemon
      - name: Verify canonical Aurora Client
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/client/debug/app-client-debug.apk"
          AAB="android/app/build/outputs/bundle/clientDebug/app-client-debug.aab"
          test -s "$APK"
          test -s "$AAB"
          VERSION_CODE=$(sed -n "s/.*versionCode \\([0-9][0-9]*\\).*/\\1/p" android/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" android/app/build.gradle | head -1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "Aurora version: $VERSION_NAME (code $VERSION_CODE)"
          sha256sum "$APK"
      - name: Publish Aurora Client APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/client/debug/app-client-debug.apk"
          AAB="android/app/build/outputs/bundle/clientDebug/app-client-debug.aab"
          test -s "$APK"
          test -s "$AAB"
          VERSION_CODE=$(sed -n "s/.*versionCode \\([0-9][0-9]*\\).*/\\1/p" android/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" android/app/build.gradle | head -1)
          TAG="aurora-apk-${VERSION_NAME}-b${VERSION_CODE}"
          TITLE="AegisPay Aurora Client ${VERSION_NAME} (${VERSION_CODE})"
          NOTES="Canonical Aurora Client UI APK. Includes username login, password recovery, Secure & Verified footer, corrected CNIC/Passport layout, automatic Shop task assignment, assigned-product marketplace flow, Shop purchase confirmation return flow, and the canonical Aurora UI guard."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
